<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WANG-AXIS Lab Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: #0f172a;
    }

    body {
      background:
        radial-gradient(circle at 10% 20%, rgba(96, 165, 250, 0.35), transparent 32%),
        radial-gradient(circle at 85% 15%, rgba(168, 85, 247, 0.26), transparent 30%),
        radial-gradient(circle at 55% 85%, rgba(45, 212, 191, 0.24), transparent 34%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 48%, #f9f7ff 100%);
      overflow: hidden;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(18px);
    }

    .topbar {
      padding: 24px 34px 18px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255, 255, 255, 0.72);
    }

    .title {
      margin: 0;
      font-size: 2.05rem;
      font-weight: 850;
      letter-spacing: -0.035em;
      color: #0f172a;
    }

    .subtitle {
      max-width: 980px;
      margin-top: 8px;
      font-size: 0.98rem;
      line-height: 1.55;
      color: #5f6b7a;
    }

    .shortcuts {
      padding: 16px 34px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      background: rgba(248, 251, 255, 0.65);
    }

    .shortcut-label {
      margin-bottom: 10px;
      font-size: 0.88rem;
      font-weight: 750;
      color: #64748b;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid rgba(203, 213, 225, 0.92);
      background: rgba(255, 255, 255, 0.82);
      color: #334155;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .chip:hover {
      transform: translateY(-1px);
      border-color: #93c5fd;
      background: #ffffff;
    }

    .chat {
      overflow-y: auto;
      padding: 28px 34px 22px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      margin-bottom: 18px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(760px, 78vw);
      padding: 15px 17px;
      border-radius: 20px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.98rem;
    }

    .msg-row.user .bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-bottom-right-radius: 7px;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.22);
    }

    .msg-row.assistant .bubble {
      background: rgba(255, 255, 255, 0.88);
      color: #1f2937;
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-bottom-left-radius: 7px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .source-link {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      font-size: 0.84rem;
      color: #64748b;
      white-space: normal;
    }

    .source-link a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .source-link a:hover {
      text-decoration: underline;
    }

    .composer {
      display: flex;
      gap: 12px;
      padding: 18px 34px 24px;
      border-top: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255, 255, 255, 0.78);
    }

    .input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 0.98rem;
      outline: none;
      background: rgba(255, 255, 255, 0.94);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18);
    }

    .btn {
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 0.98rem;
      font-weight: 800;
      padding: 15px 22px;
      cursor: pointer;
      min-width: 94px;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.22);
    }

    .btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .topbar, .shortcuts, .chat, .composer {
        padding-left: 18px;
        padding-right: 18px;
      }

      .title {
        font-size: 1.65rem;
      }

      .bubble {
        max-width: 90vw;
      }

      .composer {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">WANG-AXIS Lab Chatbot</h1>
      <div class="subtitle">
        Ask about lab resources, GPU availability, datasets, inventory rooms, GitHub repositories, and TA/RA role information.
      </div>
    </header>

    <section class="shortcuts">
      <div class="shortcut-label">Example questions</div>
      <div class="chips">
        <button class="chip" onclick="quickAsk('Give me a brief overview of the lab resources.')">Lab overview</button>
        <button class="chip" onclick="quickAsk('Which GPUs are available right now?')">Available GPUs</button>
        <button class="chip" onclick="quickAsk('Which GPUs are being used now?')">Active GPUs</button>
        <button class="chip" onclick="quickAsk('Summarize the current student TA and RA roles.')">Student roles</button>
        <button class="chip" onclick="quickAsk('Who served as TA and in which terms?')">TA assignments</button>
        <button class="chip" onclick="quickAsk('List all lab datasets with names and sizes.')">Datasets</button>
        <button class="chip" onclick="quickAsk('How many rooms are associated with the lab inventory?')">Inventory rooms</button>
        <button class="chip" onclick="quickAsk('Summarize the lab GitHub repositories.')">GitHub repositories</button>
      </div>
    </section>

    <section id="chat" class="chat"></section>

    <section class="composer">
      <input id="q" class="input" type="text" placeholder="Ask about WANG-AXIS lab resources..." />
      <button id="askBtn" class="btn">Ask</button>
    </section>
  </main>

  <script>
    const API_BASE = "https://infections-deborah-patterns-maiden.trycloudflare.com";
    const DEMO_TOKEN = "wangaxis-demo";

    const SOURCE_PAGES = {
      gpu: { label: "Lab GPU Scheduler Dashboard", url: "https://mwnafee.github.io/lab-gpu-scheduler-dashboard/" },
      roles: { label: "TA/RA Roles Dashboard", url: "https://mwnafee.github.io/wanglab_phd_roles/" },
      datasets: { label: "WANG-AXIS Lab Datasets Page", url: "https://wang-axis.github.io/datasets/" },
      github: { label: "WANG-AXIS GitHub Organization", url: "https://github.com/WANG-AXIS" },
      inventory: { label: "Internal lab inventory database", url: "" },
      overview: { label: "WANG-AXIS Lab Website", url: "https://wang-axis.github.io/" }
    };

    const chat = document.getElementById("chat");
    const input = document.getElementById("q");
    const askBtn = document.getElementById("askBtn");

    function hasWord(text, words) {
      return words.some((w) => new RegExp("\\b" + w + "\\b", "i").test(text));
    }

    function inferSource(question, data) {
      const q = question.toLowerCase();
      const topic = String(data.topic || "").toLowerCase();

      // Prefer the user's actual question first.
      if (hasWord(q, ["gpu", "gpus", "cuda", "h100", "a5000"])) return SOURCE_PAGES.gpu;
      if (hasWord(q, ["dataset", "datasets", "data"])) return SOURCE_PAGES.datasets;
      if (hasWord(q, ["github", "repo", "repos", "repository", "repositories"])) return SOURCE_PAGES.github;
      if (hasWord(q, ["inventory", "room", "rooms", "equipment", "item", "items"])) return SOURCE_PAGES.inventory;
      if (hasWord(q, ["ta", "ra", "student", "students", "role", "roles", "assistantship", "assistantships"])) return SOURCE_PAGES.roles;

      // Then use backend topic only as fallback.
      if (topic.includes("gpu")) return SOURCE_PAGES.gpu;
      if (topic.includes("dataset")) return SOURCE_PAGES.datasets;
      if (topic.includes("github") || topic.includes("repo")) return SOURCE_PAGES.github;
      if (topic.includes("inventory") || topic.includes("room")) return SOURCE_PAGES.inventory;
      if (topic.includes("role") || topic.includes("ta") || topic.includes("ra")) return SOURCE_PAGES.roles;

      return SOURCE_PAGES.overview;
    }

    function addMessage(role, text, source=null) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (source && role === "assistant") {
        const sourceDiv = document.createElement("div");
        sourceDiv.className = "source-link";
        if (source.url) {
          sourceDiv.innerHTML = 'Reference page: <a href="' + source.url + '" target="_blank" rel="noopener noreferrer">' + source.label + '</a>';
        } else {
          sourceDiv.textContent = "Reference source: " + source.label;
        }
        bubble.appendChild(sourceDiv);
      }

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "msg-row assistant";
      row.id = "typingRow";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function removeTyping() {
      const t = document.getElementById("typingRow");
      if (t) t.remove();
    }

    async function sendQuestion(qText=null) {
      const q = (qText !== null ? qText : input.value).trim();
      if (!q) return;

      addMessage("user", q);
      input.value = "";
      input.focus();
      askBtn.disabled = true;

      addTyping();

      try {
        const url = API_BASE + "/chat?q=" + encodeURIComponent(q) + "&token=" + encodeURIComponent(DEMO_TOKEN);
        const res = await fetch(url);
        const data = await res.json();

        removeTyping();

        if (data.error) {
          addMessage("assistant", "Error: " + data.error);
          return;
        }

        const source = data.source_page || inferSource(q, data);
        addMessage("assistant", data.answer || "No answer returned.", source);
      } catch (err) {
        removeTyping();
        addMessage("assistant", "The chatbot could not be reached right now. Please try again in a moment.");
      } finally {
        askBtn.disabled = false;
      }
    }

    function quickAsk(text) {
      input.value = text;
      sendQuestion(text);
    }

    askBtn.addEventListener("click", () => sendQuestion());
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendQuestion();
    });

    addMessage(
      "assistant",
      "Hello. I am the WANG-AXIS Lab Chatbot. You can ask me about lab resources, GPUs, datasets, inventory rooms, GitHub repositories, and TA/RA roles.",
      SOURCE_PAGES.overview
    );
  </script>
</body>
</html>
