<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WANG-AXIS Lab Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    .header {
      padding: 24px 26px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .header p {
      margin: 0;
      color: #6b7280;
      line-height: 1.5;
      font-size: 14px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 18px 0;
      background: white;
    }
    .chip {
      background: #eef2ff;
      border: 1px solid #dbeafe;
      color: #1f2937;
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .messages {
      height: 560px;
      overflow-y: auto;
      padding: 22px;
      background: #fbfdff;
    }
    .msg {
      display: flex;
      margin-bottom: 14px;
    }
    .msg.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 78%;
      padding: 13px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }
    .bot .bubble {
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }
    .user .bubble {
      background: #2563eb;
      color: white;
    }
    .meta {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
      white-space: normal;
    }
    .controls {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }
    input {
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    #q {
      flex: 1;
    }
    #token {
      width: 155px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .dots span {
      display: inline-block;
      animation: pulse 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>WANG-AXIS Lab Chatbot</h1>
        <p>
          Trained LoRA chatbot with targeted database grounding for lab inventory,
          datasets, GitHub repositories, GPU availability, and TA/RA roles.
        </p>
      </div>

      <div class="chips">
        <span class="chip" onclick="setQ('tell me about axis lab')">Lab overview</span>
        <span class="chip" onclick="setQ('which gpu are being used now?')">Busy GPUs</span>
        <span class="chip" onclick="setQ('which GPUs are free right now?')">Free GPUs</span>
        <span class="chip" onclick="setQ('tell me about student roles')">Student roles</span>
        <span class="chip" onclick="setQ('how many RA did Manik do?')">Manik RA count</span>
        <span class="chip" onclick="setQ('who did TA in which term?')">TA terms</span>
        <span class="chip" onclick="setQ('tell me all dataset names and sizes')">Datasets</span>
      </div>

      <div id="messages" class="messages"></div>

      <div class="controls">
        <input id="token" value="wangaxis-demo" placeholder="Demo token" />
        <input id="q" placeholder="Ask about WANG-AXIS lab resources..." onkeydown="if(event.key==='Enter') ask()" />
        <button id="send" onclick="ask()">Ask</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://infections-deborah-patterns-maiden.trycloudflare.com";
    const history = [];

    function addMessage(role, text, meta) {
      const messages = document.getElementById("messages");
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (meta) {
        const m = document.createElement("span");
        m.className = "meta";
        m.textContent = meta;
        bubble.appendChild(m);
      }

      wrap.appendChild(bubble);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
      return wrap;
    }

    function setQ(text) {
      document.getElementById("q").value = text;
      document.getElementById("q").focus();
    }

    async function ask() {
      const qEl = document.getElementById("q");
      const tokenEl = document.getElementById("token");
      const btn = document.getElementById("send");

      const q = qEl.value.trim();
      const token = tokenEl.value.trim();

      if (!q) return;

      addMessage("user", q);
      history.push("USER: " + q);
      qEl.value = "";
      btn.disabled = true;

      const thinking = addMessage("bot", "");
      thinking.querySelector(".bubble").innerHTML = 'Thinking <span class="dots"><span>.</span><span>.</span><span>.</span></span>';

      try {
        const h = history.slice(-8).join("\n");
        const url = API_BASE + "/chat?q=" + encodeURIComponent(q) + "&h=" + encodeURIComponent(h) + "&token=" + encodeURIComponent(token);

        const res = await fetch(url);
        const data = await res.json();

        thinking.remove();

        if (!res.ok) {
          addMessage("bot", "Error: " + (data.error || "Request failed."));
          return;
        }

        addMessage("bot", data.answer, "Mode: " + data.mode_label + " | Topic: " + data.topic);
        history.push("ASSISTANT: " + data.answer);
      } catch (e) {
        thinking.remove();
        addMessage("bot", "Could not reach the chatbot API. The model server or public tunnel may be offline.");
      } finally {
        btn.disabled = false;
      }
    }

    addMessage("bot", "Hello. I am the WANG-AXIS Lab Chatbot. Ask me about datasets, GPU availability, inventory rooms, GitHub repositories, or TA/RA roles.");
  </script>
</body>
</html>
